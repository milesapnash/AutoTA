name: Run code review
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  run-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Make shell script executable
        run: chmod +x review_code.sh

      - name: Run
        run: ./review_code.sh test/example_task